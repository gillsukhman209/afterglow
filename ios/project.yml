name: AfterglowRemote
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  AfterglowRemote:
    type: application
    platform: iOS
    sources:
      - App
      - path: DeviceConfig
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gill.afterglow.remote
        DEVELOPMENT_TEAM: EPB5476N6P
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Afterglow
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Speak an English command for your living room TV.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Transcribe your English TV commands.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Pair with your LG G1 and send remote controls over Wi-Fi.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 5
